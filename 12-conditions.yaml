- name: conditions
  hosts: local
  connection: local
  vars:
    number: 12
  tasks:
  - name: check number is less than 10 or not
    ansible.builtin.debug:
      msg: "Given number {{ number }} is less than 10"
    when: number < 10
    - name: number is greater than or equal to 10
    debug:
      msg: "Given number {{ number }} is greater than or equal to 10"
    when: number >= 10